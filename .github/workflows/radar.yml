name: Radar de juegos gratis

on:
  schedule:
    - cron: '7 * * * *'      # cada hora (GitHub a veces retrasa o se salta ejecuciones; el bot no repite juegos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Buscar juegos gratis y publicar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          OWNER_CHAT_ID: ${{ vars.OWNER_CHAT_ID || '1269996613' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          PROMO_TEXT: ${{ vars.PROMO_TEXT }}
          PROMO_URL: ${{ vars.PROMO_URL }}
        run: node src/bot.js
      - name: Guardar estado y web
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state.json docs/
          git diff --cached --quiet || git commit -m "Actualizar juegos gratis $(date -u +'%Y-%m-%d %H:%M')"
          git push
